# PUERTO DINAMICO
server.port=${PORT:8080}

# BASE DE DATOS
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# CLOUDLFARE WORKER
AUTH_SECRET_KEY=${AUTH_SECRET_KEY}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ZONA HORARIA ESPANOLA
spring.time.zone=Europe/Madrid
spring.jackson.time-zone=Europe/Madrid

# CORREO
spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}

# Propiedades especificas para SSL (Puerto 465)
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.socketFactory.port=2525
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
spring.mail.properties.mail.smtp.debug=true

# IMPORTANTE: Desactivar starttls para el puerto 465
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false

# Timeouts y protocolos
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000